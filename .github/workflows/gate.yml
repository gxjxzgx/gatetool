name: Gate SSTP Check

# VPN Gate SSTP 节点检测, 每小时一次: 先由检测服务 (CHECK_WORKER) 判定可用,
# 再对可用节点做「转换后的 vless 延迟测速」(经 EDT_DOMAIN 的 edgetunnel 链式代理实测)。
# 输出 sstp.json / sstp.txt / sstp.yaml / sstp-chains.txt / sstp-hosts.txt; 其余文件沿用线上旧版。
# 住宅(ISP)节点 > 20 个时, 机房节点只进 sstp.json (网页显示), 不进订阅/清单文件。
# 修改频率时同步改 common.py 里的 REFRESH_TEXT (它会写进订阅文件头部)。
on:
  schedule:
    - cron: "49 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write   # 仅用于重新启用本工作流, 防止 60 天无活动被停用

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # 三个工作流共用同一个组: 串行发布, 避免互相用旧数据覆盖
    concurrency:
      group: site-publish
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Keep schedule alive (best effort)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/gate.yml/enable" || true

      - name: Restore site from Pages
        env:
          PAGES_URL: ${{ vars.PAGES_URL }}
        run: bash tools/prepare_site.sh

      - name: Check SSTP nodes
        env:
          OUT_DIR: site
          CHECK_WORKER: "https://check.socks5.cmliussss.net/check?sstp=vpn:vpn@"
          WORKERS: "32"
          TIMEOUT: "90"
          EDT_UUID: ${{ secrets.EDT_UUID }}
          EDT_DOMAIN: ${{ secrets.EDT_DOMAIN }}
        run: python gate.py

      - name: Upload private subscriptions to Worker
        env:
          WORKER_URL: ${{ secrets.WORKER_URL }}
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
        run: bash tools/upload_private.sh

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
