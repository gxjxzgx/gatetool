name: OpenVPN Refresh

# VPN Gate OpenVPN 节点提取 + TCP 存活检查, 每小时一次。
# ovpn.yaml 上传到私有 Worker (不发布到 Pages); ovpn.json 发布到站点根目录; 其余文件沿用线上旧版。
# 住宅(ISP)节点 > 20 个时, 机房节点只进 ovpn.json (网页显示), 不进 ovpn.yaml。
on:
  schedule:
    - cron: "16 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write   # 仅用于重新启用本工作流, 防止 60 天无活动被停用

jobs:
  ovpn:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: site-publish
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Keep schedule alive (best effort)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/ovpn.yml/enable" || true

      - name: Restore site from Pages
        env:
          PAGES_URL: ${{ vars.PAGES_URL }}
        run: bash tools/prepare_site.sh

      - name: Extract OpenVPN nodes
        env:
          OUT_DIR: site
          WORKERS: "32"
          TIMEOUT: "5"
          KEEP_UDP: "0"   # UDP 无法做 TCP 检查, 直接丢弃
        run: python ovpn.py

      - name: Upload private subscriptions to Worker
        env:
          WORKER_URL: ${{ secrets.WORKER_URL }}
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
        run: bash tools/upload_private.sh

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
