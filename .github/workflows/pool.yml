name: CF Edge Pool Refresh

# Cloudflare 优选池: 每天 11:23 (北京时间) 检查一次, 实际刷新条件 (由 pool.py --check 判断):
#   手动触发 / 线上无数据 / 数据超过 8 天 / 周日(北京时间)且距上次刷新超过 20 小时
# 不需要刷新时, 后面的步骤全部跳过 (不重复部署)。
# 输出 pool.json / pool.txt / pool.yaml; pool.txt / pool.yaml 上传到私有 Worker, 不发布到 Pages。
on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write   # 仅用于重新启用本工作流, 防止 60 天无活动被停用

jobs:
  pool:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: site-publish
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Keep schedule alive (best effort)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/pool.yml/enable" || true

      - name: Restore site from Pages
        env:
          PAGES_URL: ${{ vars.PAGES_URL }}
        run: bash tools/prepare_site.sh

      - name: Decide whether to refresh
        id: need
        env:
          OUT_DIR: site
        run: python pool.py --check >> "$GITHUB_OUTPUT"

      - name: Refresh edge pool
        if: steps.need.outputs.run == 'true'
        env:
          OUT_DIR: site
          EDT_DOMAIN: ${{ secrets.EDT_DOMAIN }}
          EDT_UUID: ${{ secrets.EDT_UUID }}
          POOL_SIZE: "20"
          SAMPLE_SIZE: "200"
        run: python pool.py

      - name: Upload private subscriptions to Worker
        if: steps.need.outputs.run == 'true'
        env:
          WORKER_URL: ${{ secrets.WORKER_URL }}
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
        run: bash tools/upload_private.sh

      - uses: actions/configure-pages@v5
        if: steps.need.outputs.run == 'true'
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        if: steps.need.outputs.run == 'true'
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        if: steps.need.outputs.run == 'true'
        uses: actions/deploy-pages@v4
